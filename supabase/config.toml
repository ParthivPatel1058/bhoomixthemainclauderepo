# Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.kisan-ai-chat]
verify_jwt = false

# Image analysis is only reachable from signed-in pages, and it spends Gemini
# quota per call — so require a JWT rather than leaving it open to anyone.
[functions.crop-vision]
verify_jwt = true

# Address lookup for signed-in checkout only.
[functions.geocode]
verify_jwt = true

# UI translation runs before sign-in (the welcome screen is localised too).
[functions.translate]
verify_jwt = false

# Synthesis costs money per call and is only reachable from the signed-in
# advisory page, so require a JWT rather than leaving an open billable URL.
[functions.sarvam-speech]
verify_jwt = true

# Transcription is billed per call and only reachable from the signed-in
# advisory page, so require a JWT rather than leaving an open billable URL.
[functions.sarvam-listen]
verify_jwt = true

# A browser cannot set an Authorization header on a WebSocket, so the gateway
# cannot verify one. The relay checks the caller's access token itself, from a
# query parameter — see the function header. Do not set this to true: it would
# reject the upgrade before the function ever runs.
[functions.gemini-live-relay]
verify_jwt = false
